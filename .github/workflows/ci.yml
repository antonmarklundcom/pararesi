name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # `next build` must not touch a database (see src/db/index.ts — the mysql2
      # pool is lazy), but SESSION_SECRET is read while rendering, so give CI a
      # throwaway value. No real secret is needed to typecheck, lint or build.
      SESSION_SECRET: ci-session-secret-not-used-anywhere-real
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
